<header class="container">
    <a routerLink="/"><h1>A. Sousa</h1></a>
    <nav>
        <ul>
            <li><a routerLink="about" routerLinkActive="activePage">{{'header.about' | translate}}</a></li>
            <li><a routerLink="experiences" routerLinkActive="activePage">{{'header.experiences' | translate}}</a></li>
            <!-- <li><a routerLink="formations" routerLinkActive="activePage">{{'header.formations' | translate}}</a></li> -->
            <li class="moreOption" (click)="toggleMore()">
                <span class="moreLabel">
                    {{'header.more' | translate}} <span [@rotateIcon]="isShowMoreMenu ? 'open' : 'closed'">▼</span>
                </span>
                @if(isShowMoreMenu) {
                    <div class="moreMenu" (click)="$event.stopPropagation()">
                        <div class="menuItem">
                            <h4>{{'header.language' | translate}}</h4>
                            <ul>
                                <li (click)="changeLanguage(1)">
                                    <span [hidden]="selectedLanguage !== 1">▶&nbsp;</span>
                                    <img src="https://flagcdn.com/w20/br.png" alt="Brazil flag">
                                </li>
                                <li (click)="changeLanguage(2)">
                                    <span [hidden]="selectedLanguage !== 2">▶&nbsp;</span>
                                    <img src="https://flagcdn.com/w20/gb.png" alt="United Kingdom flag">
                                </li>
                            </ul>
                        </div>
                        <div class="menuItem">
                            <h4>{{'header.theme' | translate}}</h4>
                            <ul>
                                <li (click)="changeTheme(1)">
                                    <span [hidden]="selectedTheme !== 1">▶&nbsp;</span>
                                    <i class="material-icons">light_mode</i>
                                </li>
                                <li (click)="changeTheme(2)">
                                    <span [hidden]="selectedTheme !== 2">▶&nbsp;</span>
                                    <i class="material-icons">bedtime</i>
                                </li>
                            </ul>
                        </div>
                    </div>
                }
            </li>
        </ul>
    </nav>
</header>
